name: Create package release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix packages/iran-vector-maps test
      - run: npm --prefix packages/iran-vector-maps-data run build
      - run: npm test
      - name: Pack installable package
        run: |
          npm pack ./packages/iran-vector-maps
          npm pack ./packages/iran-vector-maps-data
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
          gh release upload "${GITHUB_REF_NAME}" iran-vector-maps-*.tgz --clobber --repo "${GITHUB_REPOSITORY}"
          gh release upload "${GITHUB_REF_NAME}" iran-vector-maps-data-*.tgz --clobber --repo "${GITHUB_REPOSITORY}"
      - name: Publish packages with npm trusted publishing
        run: |
          npm --prefix packages/iran-vector-maps publish --access public
          npm --prefix packages/iran-vector-maps-data publish --access public
